<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Data-cleaning workflow</title>
  <desc id="workflow-desc">Raw data sources are precleaned separately and merged into firm-level and market-level cleaned datasets. Each cleaned dataset produces its own analysis outputs, and the two datasets can also be combined for a cross-level regression.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636A"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #202428; }
    .lane-title { font-size: 25px; font-weight: 600; fill: #012169; }
    .lane-subtitle { font-size: 18px; font-weight: 500; fill: #4F5863; }
    .separator { stroke: #DCE3E7; stroke-width: 2; stroke-dasharray: 6 8; }
    .raw-box { fill: #FFFFFF; stroke: #59636A; stroke-width: 2.5; }
    .preclean-box { fill: #F8FAFC; stroke: #58738E; stroke-width: 2.5; }
    .cleaned-box { fill: #EEF4FA; stroke: #012169; stroke-width: 3; }
    .output-box { fill: #FFF7ED; stroke: #E07A25; stroke-width: 2.5; }
    .combined-box { fill: #F0F7EE; stroke: #389826; stroke-width: 3; }
    .box-title { font-size: 21px; font-weight: 600; }
    .box-note { font-size: 16px; fill: #4F5863; }
    .flow { stroke: #59636A; stroke-width: 2.8; fill: none; marker-end: url(#arrowhead); }
    .merge-line { stroke: #59636A; stroke-width: 2.8; fill: none; }
    .merge-label { font-size: 16px; font-weight: 600; fill: #4F5863; }
  </style>

  <text class="lane-title" x="135" y="48" text-anchor="middle">Raw Data</text>
  <text class="lane-title" x="390" y="48" text-anchor="middle">Preclean</text>
  <text class="lane-title" x="810" y="37" text-anchor="middle">Cleaned Datasets</text>
  <text class="lane-subtitle" x="810" y="64" text-anchor="middle">(by Unit of Observation)</text>
  <text class="lane-title" x="1255" y="48" text-anchor="middle">Analysis Outputs</text>

  <line class="separator" x1="250" y1="82" x2="250" y2="724"/>
  <line class="separator" x1="520" y1="82" x2="520" y2="724"/>
  <line class="separator" x1="1000" y1="82" x2="1000" y2="724"/>
  <text class="merge-label" x="250" y="116" text-anchor="middle">Preclean</text>
  <text class="merge-label" x="618" y="116" text-anchor="middle">Merge</text>

  <rect class="raw-box" x="60" y="132" width="150" height="64" rx="8"/>
  <text class="box-title" x="135" y="171" text-anchor="middle">Raw A</text>
  <rect class="raw-box" x="60" y="230" width="150" height="64" rx="8"/>
  <text class="box-title" x="135" y="269" text-anchor="middle">Raw B</text>

  <rect class="preclean-box" x="305" y="132" width="170" height="64" rx="8"/>
  <text class="box-title" x="390" y="171" text-anchor="middle">Preclean A</text>
  <rect class="preclean-box" x="305" y="230" width="170" height="64" rx="8"/>
  <text class="box-title" x="390" y="269" text-anchor="middle">Preclean B</text>

  <line class="flow" x1="210" y1="164" x2="290" y2="164"/>
  <line class="flow" x1="210" y1="262" x2="290" y2="262"/>
  <line class="merge-line" x1="475" y1="164" x2="570" y2="164"/>
  <line class="merge-line" x1="475" y1="262" x2="570" y2="262"/>
  <line class="merge-line" x1="570" y1="164" x2="570" y2="262"/>
  <line class="flow" x1="570" y1="213" x2="665" y2="213"/>

  <rect class="cleaned-box" x="680" y="158" width="260" height="110" rx="10"/>
  <text class="box-title" x="810" y="205" text-anchor="middle">Firm-level Dataset</text>
  <text class="box-note" x="810" y="236" text-anchor="middle">One row per firm</text>

  <rect class="raw-box" x="60" y="408" width="150" height="64" rx="8"/>
  <text class="box-title" x="135" y="447" text-anchor="middle">Raw C</text>
  <rect class="raw-box" x="60" y="510" width="150" height="64" rx="8"/>
  <text class="box-title" x="135" y="549" text-anchor="middle">Raw D</text>
  <rect class="raw-box" x="60" y="612" width="150" height="64" rx="8"/>
  <text class="box-title" x="135" y="651" text-anchor="middle">Raw E</text>

  <rect class="preclean-box" x="305" y="408" width="170" height="64" rx="8"/>
  <text class="box-title" x="390" y="447" text-anchor="middle">Preclean C</text>
  <rect class="preclean-box" x="305" y="510" width="170" height="64" rx="8"/>
  <text class="box-title" x="390" y="549" text-anchor="middle">Preclean D</text>
  <rect class="preclean-box" x="305" y="612" width="170" height="64" rx="8"/>
  <text class="box-title" x="390" y="651" text-anchor="middle">Preclean E</text>

  <line class="flow" x1="210" y1="440" x2="290" y2="440"/>
  <line class="flow" x1="210" y1="542" x2="290" y2="542"/>
  <line class="flow" x1="210" y1="644" x2="290" y2="644"/>
  <line class="merge-line" x1="475" y1="440" x2="570" y2="440"/>
  <line class="merge-line" x1="475" y1="542" x2="570" y2="542"/>
  <line class="merge-line" x1="475" y1="644" x2="570" y2="644"/>
  <line class="merge-line" x1="570" y1="440" x2="570" y2="644"/>
  <line class="flow" x1="570" y1="542" x2="665" y2="542"/>

  <rect class="cleaned-box" x="680" y="487" width="260" height="110" rx="10"/>
  <text class="box-title" x="810" y="534" text-anchor="middle">Market-level Dataset</text>
  <text class="box-note" x="810" y="565" text-anchor="middle">One row per market</text>

  <rect class="output-box" x="1130" y="132" width="250" height="100" rx="10"/>
  <text class="box-title" x="1255" y="174" text-anchor="middle">Firm-level</text>
  <text class="box-title" x="1255" y="202" text-anchor="middle">Table / Figure</text>

  <rect class="combined-box" x="1130" y="330" width="250" height="120" rx="10"/>
  <text class="box-title" x="1255" y="374" text-anchor="middle">Cross-level Regression</text>
  <text class="box-note" x="1255" y="405" text-anchor="middle">Combines firm- and</text>
  <text class="box-note" x="1255" y="428" text-anchor="middle">market-level data</text>

  <rect class="output-box" x="1130" y="535" width="250" height="100" rx="10"/>
  <text class="box-title" x="1255" y="577" text-anchor="middle">Market-level</text>
  <text class="box-title" x="1255" y="605" text-anchor="middle">Table / Figure</text>

  <line class="flow" x1="940" y1="193" x2="1115" y2="182"/>
  <line class="flow" x1="940" y1="575" x2="1115" y2="585"/>

  <line class="merge-line" x1="940" y1="236" x2="1035" y2="236"/>
  <line class="merge-line" x1="940" y1="520" x2="1035" y2="520"/>
  <line class="merge-line" x1="1035" y1="236" x2="1035" y2="520"/>
  <circle cx="1035" cy="390" r="4" fill="#59636A"/>
  <line class="flow" x1="1035" y1="390" x2="1115" y2="390"/>
  <text class="merge-label" x="1075" y="374" text-anchor="middle">Merge</text>
</svg>
